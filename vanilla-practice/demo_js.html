<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dự Án Mini: To-do List Pro (JS Thuần)</title>
    <style>
        :root {
            --bg-body: #0b0f19;
            --bg-card: #1e293b;
            --bg-input: #0f172a;
            --primary: #38bdf8;
            --primary-hover: #0284c7;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --danger: #f43f5e;
            --danger-hover: #e11d48;
            --success: #22c55e;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px 20px;
        }

        .todo-app {
            width: 100%;
            max-width: 550px;
            background-color: var(--bg-card);
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.05);
            padding: 28px;
        }

        .header {
            margin-bottom: 24px;
            text-align: center;
        }

        .header h1 {
            font-size: 26px;
            font-weight: 700;
            color: var(--primary);
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }

        .header p {
            font-size: 14px;
            color: var(--text-muted);
        }

        /* Form nhập công việc */
        .todo-form {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .todo-input {
            flex: 1;
            padding: 12px 16px;
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-main);
            font-size: 15px;
            outline: none;
            transition: all 0.2s;
        }

        .todo-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
        }

        .btn-add {
            padding: 12px 20px;
            background-color: var(--primary);
            color: #0f172a;
            font-weight: 600;
            font-size: 15px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-add:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
        }

        /* Bộ lọc Filter */
        .filters {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 18px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .filter-btn {
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-muted);
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .filter-btn:hover {
            color: var(--text-main);
            background-color: rgba(255, 255, 255, 0.05);
        }

        .filter-btn.active {
            color: var(--primary);
            background-color: rgba(56, 189, 248, 0.1);
            border-color: rgba(56, 189, 248, 0.3);
        }

        /* Danh sách công việc */
        .todo-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 400px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .todo-list::-webkit-scrollbar {
            width: 6px;
        }
        .todo-list::-webkit-scrollbar-thumb {
            background-color: var(--border-color);
            border-radius: 3px;
        }

        .todo-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 14px;
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            transition: all 0.2s;
        }

        .todo-item:hover {
            border-color: #475569;
            transform: translateX(2px);
        }

        .todo-left {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
            cursor: pointer;
        }

        .todo-checkbox {
            width: 18px;
            height: 18px;
            accent-color: var(--primary);
            cursor: pointer;
        }

        .todo-text {
            font-size: 15px;
            color: var(--text-main);
            word-break: break-word;
            transition: all 0.2s;
        }

        /* Trạng thái hoàn thành */
        .todo-item.completed {
            opacity: 0.6;
            background-color: rgba(15, 23, 42, 0.5);
        }

        .todo-item.completed .todo-text {
            text-decoration: line-through;
            color: var(--text-muted);
        }

        .btn-delete {
            background: transparent;
            border: none;
            color: #64748b;
            font-size: 18px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 6px;
            transition: all 0.2s;
        }

        .btn-delete:hover {
            color: var(--danger);
            background-color: rgba(244, 63, 94, 0.1);
        }

        /* Footer thống kê */
        .todo-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid var(--border-color);
            font-size: 13px;
            color: var(--text-muted);
        }

        .btn-clear {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 13px;
            transition: color 0.2s;
        }

        .btn-clear:hover {
            color: var(--danger);
            text-decoration: underline;
        }

        .empty-state {
            text-align: center;
            padding: 30px 10px;
            color: var(--text-muted);
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="todo-app">
        <div class="header">
            <h1>Công Việc Cần Làm</h1>
            <p>Ứng dụng thực hành JavaScript thuần & LocalStorage</p>
        </div>

        <!-- Form nhập công việc -->
        <form id="todo-form" class="todo-form">
            <input 
                type="text" 
                id="todo-input" 
                class="todo-input" 
                placeholder="Nhập công việc cần làm..." 
                autocomplete="off"
            >
            <button type="submit" class="btn-add">Thêm</button>
        </form>

        <!-- Bộ lọc trạng thái -->
        <div id="filters" class="filters">
            <button class="filter-btn active" data-filter="all">Tất cả</button>
            <button class="filter-btn" data-filter="active">Chưa xong</button>
            <button class="filter-btn" data-filter="completed">Đã xong</button>
        </div>

        <!-- Danh sách công việc -->
        <ul id="todo-list" class="todo-list">
            <!-- JavaScript sẽ render các thẻ <li class="todo-item"> vào đây -->
        </ul>

        <!-- Thanh thống kê & thao tác nhanh -->
        <div class="todo-footer">
            <span id="items-count">0 công việc còn lại</span>
            <button id="clear-completed-btn" class="btn-clear">Xóa các việc đã xong</button>
        </div>

        <!-- Khuôn mẫu có sẵn cho 1 thẻ việc (Template) -->
        
    </div>

    <!-- Kết nối file JavaScript -->
    <script src="demoP.js"></script>
</body>
</html>
