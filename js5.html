<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeatherCast Pro</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .header {
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            color: #38bdf8;
            margin-bottom: 6px;
        }

        /* Thanh tìm kiếm & GPS */
        .controls {
            display: flex;
            gap: 10px;
        }

        .city-input {
            flex: 1;
            background: #1e293b;
            border: 1px solid #334155;
            padding: 12px 16px;
            border-radius: 10px;
            color: #fff;
            font-size: 15px;
            outline: none;
        }

        .btn-search {
            background: #0284c7;
            color: #fff;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-gps {
            background: #334155;
            color: #38bdf8;
            border: none;
            padding: 12px 14px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
        }

        /* Card thời tiết hiện tại */
        .weather-card {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border-radius: 16px;
            border: 1px solid #334155;
            padding: 24px;
            text-align: center;
            display: none;
            flex-direction: column;
            gap: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        .city-name {
            font-size: 24px;
            font-weight: bold;
        }

        .weather-icon {
            font-size: 64px;
            margin: 10px 0;
        }

        .temp-display {
            font-size: 48px;
            font-weight: 800;
            color: #38bdf8;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .unit-toggle {
            font-size: 14px;
            background: #334155;
            padding: 4px 8px;
            border-radius: 6px;
            cursor: pointer;
            border: none;
            color: #fff;
        }

        .stats-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            background: rgba(0, 0, 0, 0.2);
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
        }

        /* Dự báo tuần */
        .forecast-box {
            display: none;
            flex-direction: column;
            gap: 10px;
        }

        .forecast-title {
            font-size: 16px;
            font-weight: bold;
            color: #94a3b8;
        }

        .forecast-list {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 8px;
        }

        .forecast-item {
            background: #1e293b;
            border: 1px solid #334155;
            padding: 12px;
            border-radius: 10px;
            min-width: 90px;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-size: 13px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>🌦️ WeatherCast Pro</h1>
            <p>Dự báo thời tiết toàn cầu theo thời gian thực (Open-Meteo API)</p>
        </div>

        <div class="controls">
            <input type="text" id="city-input" class="city-input"
                placeholder="Nhập tên thành phố (Hà Nội, Tokyo, Paris...)" autocomplete="off">
            <button id="btn-search" class="btn-search">Xem</button>
            <button id="btn-gps" class="btn-gps" title="Vị trí của tôi">📍</button>
        </div>

        <div id="status-box" style="text-align: center; color: #94a3b8;">Nhập thành phố hoặc bấm 📍 để xem thời tiết...
        </div>

        <!-- Card hiện tại -->
        <div id="weather-card" class="weather-card">
            <h2 id="city-title" class="city-name">Thành phố</h2>
            <div id="weather-icon" class="weather-icon">☀️</div>
            <div class="temp-display">
                <span id="temp-val">28</span><span id="temp-unit">°C</span>
                <button id="btn-unit" class="unit-toggle">Đổi sang °F</button>
            </div>
            <div class="stats-row">
                <div>Độ ẩm: <b id="humidity">70%</b></div>
                <div>Gió: <b id="wind">12 km/h</b></div>
            </div>
        </div>

        <!-- Danh sách 7 ngày -->
        <div id="forecast-box" class="forecast-box">
            <div class="forecast-title">Dự báo 7 ngày tới:</div>
            <div id="forecast-list" class="forecast-list"></div>
        </div>
    </div>

    <script src="weather.js"></script>
</body>

</html>
